# Mosquitto configuration for PMBus-MQTT Gateway thesis experiments
#
# Matches the gateway profile defaults:
#   - Listener on port 1883 (plain TCP, no TLS for development)
#   - WebSocket listener on port 9001 (optional, for browser debugging)
#   - Anonymous access enabled (no username/password)
#   - Persistence enabled (survive broker restart)

# ---- Listeners ----
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# ---- Authentication ----
allow_anonymous true

# ---- Persistence ----
persistence true
persistence_location /mosquitto/data/

# ---- Logging ----
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
