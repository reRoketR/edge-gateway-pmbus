# GitHub Actions CI — PMBus-MQTT Edge Gateway
#
# Two jobs:
#   1) host-tests  — compiles & runs host-side unit tests with native GCC
#                     (no ModusToolbox needed, runs on GitHub-hosted runners)
#   2) firmware     — cross-compiles all gateway profiles with GCC_ARM
#                     (requires ModusToolbox; runs on self-hosted runner only)
#
# Triggers: push/PR for host CI, plus workflow_dispatch for manual firmware builds.

name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Job 1: Host-side unit tests (always runs)
# ---------------------------------------------------------------------------
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        working-directory: rtos_test
        run: make test

      - name: Verify flush_interval_ms removed from active surfaces
        run: |
          if grep -RIn "flush_interval_ms" \
            rtos_test/source/gateway_config.h \
            rtos_test/source/gateway_config.c \
            rtos_test/source/profiles \
            rtos_test/tests \
            README.md \
            docs/architecture.md \
            docs/persistent_buffer.md; then
            echo "::error::flush_interval_ms still present in active runtime surfaces"
            exit 1
          fi

      - name: Python script syntax check
        run: |
          python3 -m py_compile scripts/capture/capture.py
          python3 -m py_compile scripts/plot/plot.py
          echo "Python syntax OK"

  # ---------------------------------------------------------------------------
  # Job 2: Firmware cross-compilation (self-hosted runner with ModusToolbox)
  # ---------------------------------------------------------------------------
  firmware:
    # Manual-only build gate for environments with a self-hosted MTB runner.
    # Push/PR CI intentionally does not claim firmware coverage unless such a
    # runner is explicitly invoked via workflow_dispatch.
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    needs: host-tests

    env:
      TOOLCHAIN: GCC_ARM
      CONFIG: Debug
      TARGET: APP_CY8CKIT-062S2-43012

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify ModusToolbox
        run: |
          TOOLS_DIR=$(find ~/ModusToolbox -maxdepth 1 -name "tools_*" -type d 2>/dev/null | sort | tail -1)
          if [ -z "$TOOLS_DIR" ]; then
            echo "::error::ModusToolbox tools not found in ~/ModusToolbox"
            exit 1
          fi
          echo "CY_TOOLS_DIR=$TOOLS_DIR" >> $GITHUB_ENV
          echo "Found ModusToolbox: $TOOLS_DIR"

      - name: Fetch libraries
        working-directory: rtos_test
        run: make getlibs CY_TOOLS_PATHS=${{ env.CY_TOOLS_DIR }}

      - name: Build default profile
        working-directory: rtos_test
        run: |
          make build \
            TOOLCHAIN=${{ env.TOOLCHAIN }} \
            CONFIG=${{ env.CONFIG }} \
            CY_TOOLS_PATHS=${{ env.CY_TOOLS_DIR }} \
            -j$(nproc)

      - name: Build experiment profiles
        working-directory: rtos_test
        run: |
          for profile in exp1_fast exp1_single exp2_throughput exp3_offline exp4_pec_off; do
            echo "::group::Building profile: $profile"
            make build \
              TOOLCHAIN=${{ env.TOOLCHAIN }} \
              CONFIG=${{ env.CONFIG }} \
              CY_TOOLS_PATHS=${{ env.CY_TOOLS_DIR }} \
              GW_PROFILE=$profile \
              -j$(nproc)
            echo "::endgroup::"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware-${{ env.CONFIG }}
          path: |
            rtos_test/build/${{ env.TARGET }}/${{ env.CONFIG }}/*.elf
            rtos_test/build/${{ env.TARGET }}/${{ env.CONFIG }}/*.hex
          retention-days: 7
