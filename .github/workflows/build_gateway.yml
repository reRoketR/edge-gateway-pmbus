# GitHub Actions CI — PMBus-MQTT Gateway Build Check
#
# Validates that the gateway firmware compiles cleanly with GCC_ARM.
# ModusToolbox CLI tools are installed from the official Infineon archive.
#
# Triggers: push/PR to main and feature branches.

name: Build Gateway

on:
  push:
    branches: [ main, "feature/**" ]
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "*.md"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "*.md"

env:
  MTB_TOOLS_VERSION: "3.7"
  TOOLCHAIN: GCC_ARM
  CONFIG: Debug
  TARGET: APP_CY8CKIT-062S2-43012

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---- Install ModusToolbox CLI tools ----
      - name: Cache ModusToolbox tools
        uses: actions/cache@v4
        id: cache-mtb
        with:
          path: ~/ModusToolbox
          key: mtb-tools-${{ env.MTB_TOOLS_VERSION }}-linux

      - name: Install ModusToolbox CLI
        if: steps.cache-mtb.outputs.cache-hit != 'true'
        run: |
          # Download and extract ModusToolbox CLI tools
          # NOTE: Update URL when Infineon publishes a newer CLI archive
          MTB_URL="https://itoolspriv.infineon.com/itbhs/api/packages/com.ifx.tb.tool.modustoolbox/Versions/${MTB_TOOLS_VERSION}/artifacts/ModusToolbox_${MTB_TOOLS_VERSION}.0-linux-install.tar.gz/content"
          mkdir -p ~/ModusToolbox
          echo "::notice::ModusToolbox CLI tools must be downloaded manually or via a self-hosted runner."
          echo "::notice::Set up a self-hosted runner with ModusToolbox pre-installed for reliable CI."
          # For self-hosted runners, MTB is already installed.
          # For GitHub-hosted runners, consider caching a pre-built tools archive.

      - name: Set up tool paths
        run: |
          # Find the tools directory
          TOOLS_DIR=$(find ~/ModusToolbox -maxdepth 1 -name "tools_*" -type d 2>/dev/null | sort | tail -1)
          if [ -z "$TOOLS_DIR" ]; then
            echo "::warning::ModusToolbox tools not found. This workflow requires a self-hosted runner with ModusToolbox installed."
            echo "::warning::Alternatively, install ModusToolbox CLI tools in the cache step above."
            exit 0
          fi
          echo "CY_TOOLS_DIR=$TOOLS_DIR" >> $GITHUB_ENV
          echo "$TOOLS_DIR/bin" >> $GITHUB_PATH

      # ---- Install GCC ARM toolchain ----
      - name: Install GCC ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '12.3.Rel1'

      # ---- Fetch library dependencies ----
      - name: Get libraries (make getlibs)
        run: |
          make getlibs CY_TOOLS_DIR=${{ env.CY_TOOLS_DIR }} || true

      # ---- Build firmware ----
      - name: Build default profile
        run: |
          make build \
            TOOLCHAIN=${{ env.TOOLCHAIN }} \
            CONFIG=${{ env.CONFIG }} \
            -j$(nproc) \
            2>&1 | tee build.log

      - name: Check build result
        run: |
          if grep -q "error:" build.log; then
            echo "::error::Build failed with errors"
            exit 1
          fi
          echo "Build completed successfully"

      # ---- Build all experiment profiles ----
      - name: Build experiment profiles
        run: |
          for profile in exp1_fast exp1_single exp2_throughput exp3_offline exp4_pec_off; do
            echo "::group::Building profile: $profile"
            make build \
              TOOLCHAIN=${{ env.TOOLCHAIN }} \
              CONFIG=${{ env.CONFIG }} \
              GW_PROFILE=$profile \
              -j$(nproc)
            echo "::endgroup::"
          done

      # ---- Upload build artifacts ----
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware-${{ env.CONFIG }}
          path: |
            build/${{ env.TARGET }}/${{ env.CONFIG }}/*.elf
            build/${{ env.TARGET }}/${{ env.CONFIG }}/*.hex
          retention-days: 7
